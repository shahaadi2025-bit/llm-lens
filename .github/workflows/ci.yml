name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing:skip-covered
      - run: pip install pip-audit && pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/scan_secrets.py

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r backend/requirements.txt
      - name: Start the app (SQLite, mock model) and run browser tests with the runner's Chrome
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.sqlite
          SECRET_KEY: ci-only-secret-key-0123456789abcdefghij
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          cd backend && alembic upgrade head
          (uvicorn app.main:app --port 8000 &) ; sleep 6
          cd ../e2e && npm install --omit=optional && node e2e.mjs && node audit.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-lens .
