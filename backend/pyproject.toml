[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lens"
version = "0.1.0"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
llm-lens = "app.cli.main:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiomatic pattern
extend-per-file-ignores = { "alembic/versions/*" = ["E501", "I001", "UP"], "app/reports/*" = ["E501"] }

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
